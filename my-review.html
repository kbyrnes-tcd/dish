<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="View your Dish reviews"/>
    <title>My Review</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>
<div class="app">

    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
                <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
    </div>

    <div class="subpage-header-title">
        <h1>My Review</h1>
    </div>

    <div class="subpage-content">
        <div class="review-list">

            <div class="review-card">
                <div class="review-restaurant-name">Noodle House</div>
                <div class="review-date">March 10, 2021</div>
                <div class="review-stars">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="review-text">
                    Great ramen and lovely service. Will definitely come back.
                </div>
                <div class="review-actions">
                    <button class="review-action-btn">Edit</button>
                    <button class="review-action-btn">Delete</button>
                </div>
            </div>

            <div class="review-card">
                <div class="review-restaurant-name">Noodle House</div>
                <div class="review-date">February 25, 2021</div>
                <div class="review-stars">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="review-text">
                    Tasty pasta, but a bit too noisy.
                </div>
                <div class="review-actions">
                    <button class="review-action-btn">Edit</button>
                    <button class="review-action-btn">Delete</button>
                </div>
            </div>

            <div class="review-card">
                <div class="review-restaurant-name">Noodle House</div>
                <div class="review-date">January 12, 2021</div>
                <div class="review-stars">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="review-text">
                    Amazing Indian food. Loved it.
                </div>
                <div class="review-actions">
                    <button class="review-action-btn">Edit</button>
                    <button class="review-action-btn">Delete</button>
                </div>
            </div>

        </div>
    </div>

    <div class="containerFooter">
        <div class="footerNav">
            <a href="index.html" class="navItem">
                <img src="assets/icon-feed.svg" alt="Feed icon">
                <span>Feed</span>
            </a>

            <a href="new-dish.html" class="navItem">
                <img src="assets/icon-new.svg" alt="New dish icon">
                <span>New Dish</span>
            </a>

            <a href="my-dishes.html" class="navItem">
                <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
                <span>My Dishes</span>
            </a>

            <a href="profile.html" class="navItem active">
                <img src="assets/icon-profile.svg" alt="Profile icon">
                <span>Profile</span>
            </a>
        </div>
    </div>

</div>
</body>
</html>
