<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--SEO data here in the description-->
    <meta name="description" content="A public feed for Dish"/> 
    <title>Dish Public Feed</title>
    
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!--CSS link-->
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<div class="app"> <!--lock to mobile dimensions-->

    <!--Header content-->
    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
            <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
        
        <div class="feedSearch">    
            <form class="d-flex" role="search">
                <input 
                    class="form-control me-2" 
                    type="search" 
                    placeholder="Search restaurant, location, or dish" 
                >
                <button class="btn btn-outline-success" type="submit">
                Search
                </button>
            </form>
        </div>
    </div>

    <!--Main content-->
    <div class="containerMain">
        <div class="feed">  
            <h1>Your Feed</h1>
            <!--Card content-->
            <div class="feedPost">
                
                <div class="cardProfile">   
                    <!--Profile pic-->
                    <img src="assets/profile-pic-placeholder.jpg" alt="Profile picture of a user" class="profilePic">
                    
                    <!--line 1-->
                    <div class="profileText">
                    <p>
                        <span class="username">Username</span> ranked <span class="dishNumber">2</span> dishes
                    </p>
                    <!--line 2-->
                    <p>
                        from <span class="restaurantName">Host</span>
                    </p>
                    <!--line 3-->
                    <p>
                        <span class="location">Ranelagh</span> <span class="price">€€€</span> - <span class="cuisine">Italian</span>
                    </p>
                    </div>
                </div>

                <div class="cardImage">
                    <div class="imageCarousel">
                        <img src="assets/image-food-placeholder.jpg" alt="Food 1">
                        <img src="assets/image-food-placeholder.jpg" alt="Food 2">
                        <img src="assets/image-food-placeholder.jpg" alt="Food 3">
                        <img src="assets/image-food-placeholder.jpg" alt="Food 4">
                        <img src="assets/image-food-placeholder.jpg" alt="Food 5">
                    </div>
                </div>

                <div class="cardRating"> 
                    <!--rating container-->
                    <div class="rating">
                        <div class="star"><img src="assets/icon-star.svg" alt="Star icon"></div>
                        <span class="ratingNumber">4.7</span>
                    </div>
                    <!--dish info-->
                        <div class="dishInfo">
                        <span class="dishName">Dish Name</span> 
                        <span class="dishType">(Main)</span>
                        </div>
                </div>

                <div class="cardRating"> 
                    <!--rating container-->
                    <div class="rating">
                        <div class="star"><img src="assets/icon-star.svg" alt="Star icon"></div>
                        <span class="ratingNumber">5.0</span>
                    </div>
                    <!--dish info-->
                        <div class="dishInfo">
                        <span class="dishName">Dish Name</span> 
                        <span class="dishType">(Dessert)</span>
                        </div>
                </div>
                
                <div class="cardNotes">
                    <div class="notesHeader">
                        <h2>Notes</h2>
                    </div>
                    <div class="note">
                        <p>
                            Lorem ipsum dolor sit amet, consectetur adipiscing elit. 
                            Donec vel sapien eget nunc efficitur efficitur. 
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Footer content-->
    <div class="containerFooter">
    <div class="footerNav">

        <!-- Feed -->
        <a href="index.html" class="navItem active">
            <img src="assets/icon-feed.svg" alt="Feed icon">
            <span>Feed</span>
        </a>

        <!-- New Dish -->
        <a href="new-dish.html" class="navItem">
            <img src="assets/icon-new.svg" alt="New dish icon">
            <span>New Dish</span>
        </a>

        <!-- My Dishes -->
        <a href="my-dishes.html" class="navItem">
            <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
            <span>My Dishes</span>
        </a>

        <!-- Profile -->
        <a href="profile.html" class="navItem">
            <img src="assets/icon-profile.svg" alt="Profile icon">
            <span>Profile</span>
        </a>
    </div>
</div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>



</div> <!--div close: lock to mobile dimensions-->
</body>
</html>
