<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--SEO data here in the description-->
    <meta name="description" content="Create an account on Dish"/> 
    <title>Create an Account</title>
    
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!--CSS link-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<div class="app"> <!--lock to mobile dimensions-->

    <!--Header content-->
    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
            <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
        <div class="skipLinkContainer">
            <a href="index.html" class="skipLink">Skip</a>
        </div>
    </div>

    <!--Main content-->
    <div class="containerMain"> 

        <section class="createAccountSection">
            <h1>Create an Account</h1>

            <p class="subtitle">
                Start your profile to begin discovering dishes, sharing reviews, and earning rewards.
            </p>

            <!-- Form for account creation & enter key listener -->
            <form id="createAccountForm">

                <!-- Username -->
                <div class="inputGroup">
                    <input
                        type="text"
                        class="formInput"
                        placeholder="Choose a username"
                        id="username"
                        autocomplete="username"
                        maxlength="20"
                    >
                    <div id="usernameMessage" class="fieldMessage"></div>
                </div>

                <!-- Email -->
                <div class="inputGroup">
                    <input
                        type="email"
                        class="formInput"
                        placeholder="Enter your email"
                        id="email"
                        autocomplete="email"
                    >
                    <div id="emailMessage" class="fieldMessage"></div>
                </div>

                <!-- Password -->
                <div class="inputGroup">
                    <input
                        type="password"
                        class="formInput"
                        placeholder="Create a password"
                        id="password"
                        autocomplete="new-password"
                    >
                    <div id="passwordMessage" class="fieldMessage"></div>
                </div>

                <!-- Confirm Password -->
                <div class="inputGroup">
                    <input
                        type="password"
                        class="formInput"
                        placeholder="Confirm password"
                        id="confirmPassword"
                        autocomplete="new-password"
                    >
                    <div id="confirmPasswordMessage" class="fieldMessage"></div>
                </div>

                <!-- Overall form message -->
                <div id="createAccountMessage"></div>

                <!-- Submit button -->
                <button type="submit" class="formButton" id="createAccountBtn">
                    Create Account
                </button>

            </form>

        </section>

        <div class="questionLogin">
            <p>
                Already have an account? 
                <a href="login.html" class="loginLink">Login</a>
            </p>
        </div>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/create-account.js"></script>

</div> <!--div close: lock to mobile dimensions-->
</body>
</html>
