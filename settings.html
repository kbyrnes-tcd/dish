<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="A public feed for Dish"/> 
    <title>Settings</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
    <div class="app">

        <div class="containerHeader">
            <div class="logo">
                <a href="index.html">
                    <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
                </a>
            </div>
            <div class="headerAvatar" id="headerAvatar">
                <span class="headerAvatarLetter" id="headerAvatarLetter">?</span>
            </div>
        </div>

        <div class="containerMain">
            <div class="manageProfileSection">
                <h1>Settings</h1>
                <p class="subtitle">Manage your app preferences.</p>

                <div class="settingsCard">
                    <div class="settingsRow settingsRowToggle">
                        <div>
                            <p class="settingsLabel">Notifications</p>
                            <p class="settingsSubtext">Receive reminders and app updates.</p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="notificationsToggle">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="settingsRow settingsRowToggle">
                        <div>
                            <p class="settingsLabel">Privacy</p>
                            <p class="settingsSubtext">Keep your profile more private.</p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="privacyToggle">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="settingsRow">
                        <div>
                            <p class="settingsLabel">App Preferences</p>
                            <p class="settingsSubtext">Choose how Dish feels to use.</p>
                        </div>
                    </div>

                    <div class="settingsRow">
                        <label for="themeSelect" class="settingsLabel settingsSelectLabel">Theme</label>
                        <select id="themeSelect" class="settingsSelect">
                            <option value="light">Default</option>
                            <option value="dark">Dark</option>
                        </select>
                    </div>

                    <div class="settingsRow settingsRowToggle">
                        <div>
                            <p class="settingsLabel">Reduced Motion</p>
                            <p class="settingsSubtext">Use fewer visual animations.</p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="motionToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <button type="button" class="formButton" id="saveSettingsBtn">Save Settings</button>
                <div id="settingsMessage"></div>

                <a href="profile.html" class="formButton settingsBackButton">Back to Profile</a>
            </div>
        </div>

        <div class="containerFooter">
            <div class="footerNav">
                <a href="index.html" class="navItem">
                    <img src="assets/icon-feed.svg" alt="Feed icon">
                    <span>Feed</span>
                </a>

                <a href="new-dish.html" class="navItem">
                    <img src="assets/icon-new.svg" alt="New dish icon">
                    <span>New Dish</span>
                </a>

                <a href="my-dishes.html" class="navItem">
                    <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
                    <span>My Dishes</span>
                </a>

                <a href="profile.html" class="navItem active">
                    <img src="assets/icon-profile.svg" alt="Profile icon">
                    <span>Profile</span>
                </a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
