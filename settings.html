<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Dish settings page"/>
    <title>Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>
<div class="app">

    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
                <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
    </div>

    <div class="subpage-header-title">
        <h1>Settings</h1>
    </div>

    <div class="subpage-content">
        <div class="settings-list-card">

            <a href="#" class="settings-row">
                <div class="settings-icon">
                    <i class="fa-regular fa-bell"></i>
                </div>
                <div class="settings-label">Notification Preferences</div>
                <i class="fa-solid fa-chevron-right settings-chevron"></i>
            </a>

            <a href="#" class="settings-row">
                <div class="settings-icon">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div class="settings-label">Language</div>
                <div class="settings-value">English</div>
                <i class="fa-solid fa-chevron-right settings-chevron"></i>
            </a>

            <a href="#" class="settings-row">
                <div class="settings-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="settings-label">Privacy &amp; Security</div>
                <i class="fa-solid fa-chevron-right settings-chevron"></i>
            </a>

        </div>

        <div class="settings-logout-wrap">
            <button class="settings-logout-btn">Log Out</button>
        </div>
    </div>

    <div class="containerFooter">
        <div class="footerNav">
            <a href="index.html" class="navItem">
                <img src="assets/icon-feed.svg" alt="Feed icon">
                <span>Feed</span>
            </a>

            <a href="new-dish.html" class="navItem">
                <img src="assets/icon-new.svg" alt="New dish icon">
                <span>New Dish</span>
            </a>

            <a href="my-dishes.html" class="navItem">
                <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
                <span>My Dishes</span>
            </a>

            <a href="profile.html" class="navItem active">
                <img src="assets/icon-profile.svg" alt="Profile icon">
                <span>Profile</span>
            </a>
        </div>
    </div>

</div>
</body>
</html>
