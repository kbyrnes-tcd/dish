<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--SEO data here in the description-->
    <meta name="description" content="A public feed for Dish"/> 
    <title>Dish Profile Page</title>
    
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!--CSS link-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>


<body>
<div class="app"> <!--lock to mobile dimensions -- note: each page should be contained within this div -->

    <!--Header content-->
    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
            <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
    </div>

    <!-- Profile header -->
    <div class="profile-header">

        <div class="avatar-container" id="profileAvatar">
            <span class="avatar-letter" id="avatarLetter">?</span>
        </div>

        <!-- adds IDs for backend - pls do not change id names -->
        <h1 class="user-name" id="profileUsername">Loading...</h1>
        <p class="user-email" id="profileEmail">Loading...</p>
    </div>

    <!-- XP card -->
    <div class="xp-card">
        <div class="trophy-icon">
            <img src="assets/Group 2.svg" alt="Trophy" width="100%">
        </div>
        <div class="xp-info">
            <div class="xp-text-row">
                <span id="profileXpText">XP: 0/250</span>
                <span id="profileLevelText">Level 1</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="profileXpBar"></div>
            </div>
        </div>
    </div>

    <!-- Menu list -->
    <div class="menu-card">
        <a href="manage-profile.html" class="menu-item">
            <img src="assets/a1.svg" alt="Manage Profile icon">
            <span class="menu-text">Manage Profile</span>
            <i class="fa-solid fa-caret-right arrow-icon"></i>
        </a>

        <a href="#" class="menu-item">
            <img src="assets/a2.svg" alt="Settings icon">
            <span class="menu-text">Settings</span>
            <i class="fa-solid fa-caret-right arrow-icon"></i>
        </a>

        <!-- Sign out - handled through JS - do not change id -->
        <a href="#" class="menu-item-sign-out" id="logoutBtn">
            <span class="sign-out">Sign out</span>
        </a>

    </div>

    <!--Footer content-->
    <div class="containerFooter">
        <div class="footerNav">

            <!-- Feed -->
            <a href="index.html" class="navItem">
                <img src="assets/icon-feed.svg" alt="Feed icon">
                <span>Feed</span>
            </a>

            <!-- New Dish -->
            <a href="new-dish.html" class="navItem">
                <img src="assets/icon-new.svg" alt="New dish icon">
                <span>New Dish</span>
            </a>

            <!-- My Dishes -->
            <a href="my-dishes.html" class="navItem">
                <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
                <span>My Dishes</span>
            </a>

            <!-- Profile -->
            <a href="profile.html" class="navItem active">
                <img src="assets/icon-profile.svg" alt="Profile icon">
                <span>Profile</span>
            </a>
        </div>
    </div>
    
    <div class="levelOverlay" id="levelOverlay" aria-hidden="true">
        <div class="levelBox" role="dialog" aria-modal="true" aria-labelledby="levelTitle">
            <button type="button" class="levelClose" id="levelClose" aria-label="Close">x</button>
            <p class="kicker">Nice work</p>
            <h2 id="levelTitle">Level Up!</h2>
            <p class="levelText" id="levelText">Level 1 to Level 2</p>

            <div class="levelLabels">
                <span id="oldLevel">Level 1</span>
                <span id="newLevel">Level 2</span>
            </div>

            <div class="levelTrack">
                <div class="levelFill"></div>
                <button type="button" class="turtle" id="turtle" aria-label="Tap turtle">
                    <img src="assets/trophy.svg" alt="Dish turtle">
                </button>
            </div>

            <p class="tapHint" id="tapHint">Congratulations!</p>
            <div class="popLayer" id="popLayer" aria-hidden="true"></div>
            <button type="button" class="continueButton" id="continueButton">Continue</button>
        </div>
    </div>

<audio id="levelSound" src="assets/level-up.mp3" preload="auto"></audio>

<script src="/js/profile.js"></script>

</div> <!--lock to mobile dimensions - close div -->


</body>
</html>
