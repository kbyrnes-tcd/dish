<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Dish</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="profile-page">

<div class="mobile-container">
    <!-- Header -->
    <div class="header">
        <div class="logo">Dish</div>
    </div>

    <!-- Profile header -->
    <div class="profile-header">
        <div class="avatar-container">
            <img src="assets/Ellipse 3.svg" alt="Avatar">
        </div>
        <h1 class="user-name">Kayla B</h1>
        <p class="user-email">kbyrnes@tcd.ie</p>
    </div>

    <!-- XP card -->
    <div class="xp-card">
        <div class="trophy-icon">
            <img src="assets/Group 2.svg" alt="Trophy" width="100%">
        </div>
        <div class="xp-info">
            <div class="xp-text-row">
                <span>XP: 320/500</span>
                <span>Level 2</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Menu list -->
    <div class="menu-card">
        <a href="#" class="menu-item">
            <img src="assets/a1.svg" alt="Manage Profile icon">
            <span class="menu-text">Manage Profile</span>
            <i class="fa-solid fa-caret-right arrow-icon"></i>
        </a>
        <a href="#" class="menu-item">
            <img src="assets/a3.svg" alt="Reviews icon">
            <span class="menu-text">Reviews</span>
            <i class="fa-solid fa-caret-right arrow-icon"></i>
        </a>
        <a href="#" class="menu-item">
            <img src="assets/a2.svg" alt="Settings icon">
            <span class="menu-text">Settings</span>
            <i class="fa-solid fa-caret-right arrow-icon"></i>
        </a>
        <div class="sign-out">Sign Out</div>
    </div>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
        <img src="assets/Icon1.svg" alt="Feed icon">
        <span>Feed</span>
    </a>
    <a href="#" class="nav-item">
        <img src="assets/Icon2.svg" alt="New Dish icon">
        <span>New Dish</span>
    </a>
    <a href="#" class="nav-item">
        <img src="assets/Icon3.svg" alt="My Dishes icon">
        <span>My Dishes</span>
    </a>
    <a href="profile.html" class="nav-item active">
        <div class="icon-wrapper">
            <img src="assets/Icon4.svg" alt="Profile icon">
        </div>
        <span>Profile</span>
    </a>
</nav>
</div>

</body>
</html>
