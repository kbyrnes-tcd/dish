<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Manage your Dish profile"/>
    <title>Manage Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>
<div class="app">

    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
                <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
    </div>

    <div class="subpage-header-title">
        <h1>Manage Profile</h1>
    </div>

    <div class="subpage-content">
        <div class="avatar-edit-section">
            <div class="avatar-edit-wrapper">
                <div class="avatar-container">
                    <span class="avatar-letter">K</span>
                </div>
                <div class="avatar-edit-btn">
                    <i class="fa-solid fa-pen"></i>
                </div>
            </div>
        </div>

        <div class="profile-form-card">
            <div class="profile-form-row">
                <label for="profileName">Name</label>
                <div class="profile-input-wrap">
                    <input type="text" id="profileName" value="Kayla B">
                </div>
            </div>

            <div class="profile-form-row">
                <label for="profileEmailInput">Email</label>
                <div class="profile-input-wrap">
                    <input type="email" id="profileEmailInput" value="kbyrnes@tcd.ie">
                </div>
            </div>

            <div class="profile-form-row">
                <label for="profileLocation">Location</label>
                <div class="profile-input-wrap">
                    <select id="profileLocation">
                        <option>Dublin, Ireland</option>
                        <option>London, UK</option>
                        <option>New York, USA</option>
                    </select>
                    <i class="fa-solid fa-caret-down profile-select-arrow"></i>
                </div>
            </div>
        </div>

        <div class="profile-btn-group">
            <button class="profile-save-btn">Save Changes</button>
            <button class="profile-cancel-btn" onclick="window.location.href='profile.html'">Cancel</button>
        </div>
    </div>

    <div class="containerFooter">
        <div class="footerNav">
            <a href="index.html" class="navItem">
                <img src="assets/icon-feed.svg" alt="Feed icon">
                <span>Feed</span>
            </a>

            <a href="new-dish.html" class="navItem">
                <img src="assets/icon-new.svg" alt="New dish icon">
                <span>New Dish</span>
            </a>

            <a href="my-dishes.html" class="navItem">
                <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
                <span>My Dishes</span>
            </a>

            <a href="profile.html" class="navItem active">
                <img src="assets/icon-profile.svg" alt="Profile icon">
                <span>Profile</span>
            </a>
        </div>
    </div>

</div>
</body>
</html>
