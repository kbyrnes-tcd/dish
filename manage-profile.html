<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Manage your Dish profile"/>
    <title>Manage Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css"/>
</head>
<body>
<div class="app">
    <div class="containerHeader">
        <div class="logo">
            <a href="profile.html">
                <img src="./assets/dish-logo.png" alt="Dish logo" width="60">
            </a>
        </div>
    </div>

    <div class="containerMain">
        <div class="manageProfileSection">
            <h1>Manage Profile</h1>
            <p class="subtitle">Update your details and account settings.</p>

            <div class="manageAvatarWrap">
                <div class="avatar-preview" id="avatarPreview">
                    <span id="avatarPreviewLetter">?</span>
                </div>
                <input type="file" id="avatarInput" class="formInput" accept="image/png,image/jpeg,image/webp">
            </div>

            <form id="profileForm">
                <input type="text" id="profileUsernameInput" class="formInput" placeholder="Username">
                <input type="email" id="profileEmailInput" class="formInput" placeholder="Email">
                <button type="submit" class="formButton">Save Profile</button>
                <div id="profileMessage"></div>
            </form>

            <div class="manageDivider"></div>

            <form id="passwordForm">
                <h2>Change Password</h2>
                <input type="password" id="currentPassword" class="formInput" placeholder="Current password">
                <input type="password" id="newPassword" class="formInput" placeholder="New password">
                <input type="password" id="confirmPassword" class="formInput" placeholder="Confirm new password">
                <button type="submit" class="formButton">Update Password</button>
                <div id="passwordMessage"></div>
            </form>

            <div class="manageDivider"></div>

            <button id="deleteAccountBtn" class="deleteAccountBtn">Delete Account</button>
            <div id="deleteMessage"></div>
        </div>
    </div>

    <div class="containerFooter">
        <div class="footerNav">

            <a href="index.html" class="navItem">
                <img src="assets/icon-feed.svg" alt="Feed icon">
                <span>Feed</span>
            </a>

            <a href="new-dish.html" class="navItem">
                <img src="assets/icon-new.svg" alt="New dish icon">
                <span>New Dish</span>
            </a>

            <a href="my-dishes.html" class="navItem">
                <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
                <span>My Dishes</span>
            </a>

            <a href="profile.html" class="navItem active">
                <img src="assets/icon-profile.svg" alt="Profile icon">
                <span>Profile</span>
            </a>
        </div>
    </div>

    <script src="./js/manage-profile.js"></script>
</div>
</body>
</html>
