<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Create a new Dish account password"/>
    <title>Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<div class="app">

    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
                <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
    </div>

    <div class="containerMain">

        <section class="createAccountSection">
            <h1>Reset Password</h1>

            <p class="subtitle">
                Create a new password for your account.
            </p>

            <form id="resetPasswordForm">

                <div class="inputGroup">
                    <input
                        type="password"
                        class="formInput"
                        placeholder="Enter new password"
                        id="newPassword"
                        autocomplete="new-password"
                    >
                    <div id="newPasswordMessage" class="fieldMessage"></div>
                </div>

                <div class="inputGroup">
                    <input
                        type="password"
                        class="formInput"
                        placeholder="Confirm new password"
                        id="confirmPassword"
                        autocomplete="new-password"
                    >
                    <div id="confirmPasswordMessage" class="fieldMessage"></div>
                </div>

                <div id="resetPasswordMessage"></div>

                <button type="submit" class="formButton" id="resetPasswordBtn">
                    Reset password
                </button>

            </form>

        </section>

        <div class="questionLogin">
            <p>
                Already reset it?
                <a href="login.html" class="loginLink">Login</a>
            </p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/reset-password.js"></script>

</div>
</body>
</html>
