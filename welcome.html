<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--SEO data here in the description-->
    <meta name="description" content="Welcome screen forDish"/> 
    <title>Dish Welcome Screen</title>
    
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!--CSS link-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
    <div class="app">
        <!-- Loading screen -->
        <div id="loadingScreen">
            <img src="assets/dish-logo-3.png" alt="Dish Logo" class="loadingLogo">
        </div>

        <div class="welcomeScreen">

            <!--background svg-->
            <img src="assets/welcome-bg.png" alt="welcome screen background" class="welcomeBg">
            
            <!--logo-->
            <img src="assets/dish-logo.png" alt="Dish logo" class="welcomeLogo">

            <!--mascot-->
            <img src="assets/mascot-1.png" alt="Dish mascot, a turtle revealing a shell full of food" class="welcomeMascot">   

            <!--welcome content-->
            <div class="welcomeContent">
                <h1>Welcome</h1>
                <a href="create-account.html"><button class="btnStart">Get started</button></a>
                
                <a href="login.html"><button class="btnLogin">Login</button></a>
            </div>
        </div>

        <!--Loading screen JS link-->
        <script src="/js/loading.js"></script>

    </div>
</body>
</html>
