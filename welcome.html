<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--SEO data here in the description-->
    <meta name="description" content="Welcome screen forDish"/> 
    <title>Dish Welcome Screen</title>
    
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!--CSS link-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
    <div class="welcomeScreen">

        <!--background svg-->
        <img src="assets/welcome-bg.png" alt="welcome screen background" class="welcomeBg">
         
        <!--logo-->
        <img src="assets/dish-logo.png" alt="Dish logo" class="welcomeLogo">

        <!--mascot-->
        <img src="assets/image-food-placeholder.jpg" alt="Dish mascot, a turtle revealing a shell full of food" class="welcomeMascot">   

        <!--welcome content-->
        <div class="welcomeContent">
            <h1>Welcome</h1>
            <button class="btnStart">Get Started</button>
            <button class="btnLogin">Login</button>
        </div>

    </div>
</body>
