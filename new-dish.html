<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--SEO data here in the description-->
    <meta name="description" content="A new dish for Dish"/> 
    <title>New Dish</title>
    
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!--CSS link-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<div class="app"> <!--lock to mobile dimensions-->

    <!--Header content-->
    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
            <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
    </div>

    <!--Main content-->
    <div class="containerMain"> 

        <div class="newDishSection">
            <h1>Try a New Dish</h1>

            <p class="subtitle">
                Choose your preferences, and we’ll find a dish worth trying.
            </p>

            <!--Cuisine dropdown-->
            <div class="dropdown">
                <button class="dropdownToggle">
                    <span class="dropdownLabel">Select Cuisine(s)</span>
                    <span class="caret"></span>
                </button>

                <div class="dropdownMenu">
                    <label class="dropdownItem">
                        <input type="checkbox" checked class="selectAll">
                        Select All Cuisines
                    </label>

                    <div class="dropdownDivider"></div>

                    <label class="dropdownItem">
                        <input type="checkbox"> Italian
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> Mexican
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> Japanese
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> Indian
                    </label>
                </div>
            </div>

            <!--Location dropdown-->
            <div class="dropdown">
                <button class="dropdownToggle">
                    <span class="dropdownLabel">Select Location(s)</span>
                    <span class="caret"></span>
                </button>

                <div class="dropdownMenu">
                    <label class="dropdownItem">
                        <input type="checkbox" checked class="selectAll">
                        Select All Locations
                    </label>

                    <div class="dropdownDivider"></div>

                    <label class="dropdownItem">
                        <input type="checkbox"> Ranelagh
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> Rathmines
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> Stoneybatter
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> Phibsboro
                    </label>
                </div>
            </div>

            <!--Price Range dropdown-->
            <div class="dropdown">
                <button class="dropdownToggle">
                    <span class="dropdownLabel">Select Price Range</span>
                    <span class="caret"></span>
                </button>

                <div class="dropdownMenu">
                    <label class="dropdownItem">
                        <input type="checkbox" checked class="selectAll">
                        Select All Price Ranges
                    </label>

                    <div class="dropdownDivider"></div>

                    <label class="dropdownItem">
                        <input type="checkbox"> €
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> €€
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> €€€
                    </label>
                </div>
            </div>

            <!--Course Type dropdown-->
            <div class="dropdown">
                <button class="dropdownToggle">
                    <span class="dropdownLabel">Select Course Type</span>
                    <span class="caret"></span>
                </button>

                <div class="dropdownMenu">
                    <label class="dropdownItem">
                        <input type="checkbox" checked class="selectAll">
                        Select All Course Types
                    </label>

                    <div class="dropdownDivider"></div>

                    <label class="dropdownItem">
                        <input type="checkbox"> Starter
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> Main
                    </label>
                    <label class="dropdownItem">
                        <input type="checkbox"> Dessert
                    </label>
                </div>
            </div>

            <button class="btnFindDish">Find a Dish</button>

        </div>
    </div>


    <!--Footer content-->
    <div class="containerFooter">
    <div class="footerNav">

        <!-- Feed -->
        <a href="index.html" class="navItem">
            <img src="assets/icon-feed.svg" alt="Feed icon">
            <span>Feed</span>
        </a>

        <!-- New Dish -->
        <a href="new-dish.html" class="navItem active">
            <img src="assets/icon-new.svg" alt="New dish icon">
            <span>New Dish</span>
        </a>

        <!-- My Dishes -->
        <a href="my-dishes.html" class="navItem">
            <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
            <span>My Dishes</span>
        </a>

        <!-- Profile -->
        <a href="profile.html" class="navItem">
            <img src="assets/icon-profile.svg" alt="Profile icon">
            <span>Profile</span>
        </a>
    </div>
</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="interaction.js"></script>

</div> <!--div close: lock to mobile dimensions-->
</body>
</html>
