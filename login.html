<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--SEO data here in the description-->
    <meta name="description" content="Log into your account on Dish"/> 
    <title>Login</title>
    
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!--CSS link-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<div class="app"> <!--lock to mobile dimensions-->

    <!--Header content-->
    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
            <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
    </div>

    <!--Main content-->
    <div class="containerMain"> 

        <section class="createAccountSection">
            <h1>Login</h1>

            <p class="subtitle">
                Sign into your account.
            </p>

            <!-- Email -->
            <div class="inputGroup">
                <input
                    type="email"
                    class="formInput"
                    placeholder="Enter your email"
                    id="email"
                    autocomplete="email"
                >
                <div id="emailMessage" class="fieldMessage"></div>
            </div>

            <!-- Password -->
            <div class="inputGroup">
                <input
                    type="password"
                    class="formInput"
                    placeholder="Enter your password"
                    id="password"
                    autocomplete="current-password"
                >
                <div id="passwordMessage" class="fieldMessage"></div>
            </div>

            <p class="forgotPassword">
                <a href="#" class="forgotPasswordLink">Forgot your password?</a>
            </p>

            <!-- Overall form message -->
            <div id="loginMessage"></div>

            <!-- Submit button -->
            <button type="button" class="formButton" id="loginBtn">
                Login
            </button>
            
        </section>

        <div class="questionLogin">
            <p>
                Don't have an account? 
                <a href="create-account.html" class="loginLink">Create one</a>
            </p>
        </div>

    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/login.js"></script>

</div> <!--div close: lock to mobile dimensions-->
</body>
</html>
