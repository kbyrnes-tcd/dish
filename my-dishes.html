<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--SEO data here in the description-->
    <meta name="description" content="A public feed for Dish"/> 
    <title>My Dishes</title>
    
    <!--Bootstrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!--CSS link-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<div class="app"> <!--lock to mobile dimensions -->

    <!--Header content-->
    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
            <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
        <div class="headerAvatar" id="headerAvatar">
            <span class="headerAvatarLetter" id="headerAvatarLetter">?</span>
        </div>
    </div>

    <!--body -->
    <div class="containerMain">
            
            <!--Current dishes retry link-->
            <div class="returnLinkContainer" id="returnLinkContainer" hidden>
                <a href="new-dish.html" class="returnLink">Try a different dish</a>
            </div>

            <!--target area for js -->
            <div id="currentDishContainer">
                <div class="featuredDishCard">
                    <div class="featuredDishImage">
                        <div class="xpTag">100 XP</div>
                    </div>

                    <div class="featuredDishContent">
                        <p class="featuredDishMeta">Italian - €€</p>
                        <h2 class="featuredDishName">Calzone Combo</h2>

                        <div class="featuredDishRestaurantBlock">
                            <p class="featuredDishRestaurant">Mizzoni's Pizza - Cherry Orchard</p>
                            <p class="featuredDishAddress">123 Example Street, Dublin 10</p>
                        </div>
                    </div>
                </div>
            </div>

            
            <!--Past dishes -->
            <h1>Past dishes</h1>
            <div id="pastDishesContainer"></div>

    </div>

    <!--Footer content-->
    <div class="containerFooter">
        <div class="footerNav">

            <!-- Feed -->
            <a href="index.html" class="navItem">
                <img src="assets/icon-feed.svg" alt="Feed icon">
                <span>Feed</span>
            </a>

            <!-- New Dish -->
            <a href="new-dish.html" class="navItem">
                <img src="assets/icon-new.svg" alt="New dish icon">
                <span>New Dish</span>
            </a>

            <!-- My Dishes -->
            <a href="my-dishes.html" class="navItem active">
                <img src="assets/icon-my-dishes.svg" alt="My dishes icon">
                <span>My Dishes</span>
            </a>

            <!-- Profile -->
            <a href="profile.html" class="navItem">
                <img src="assets/icon-profile.svg" alt="Profile icon">
                <span>Profile</span>
            </a>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/my-dishes.js"></script>
    <script src="/js/header.js"></script>

</div> <!--lock to mobile dimensions - close div -->
</body>
</html>
