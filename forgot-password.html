<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Reset your Dish account password"/>
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
<div class="app">

    <div class="containerHeader">
        <div class="logo">
            <a href="index.html">
                <img src="assets/dish-logo.png" alt="Lettering logo of the word Dish" width="60">
            </a>
        </div>
    </div>

    <div class="containerMain">

        <section class="createAccountSection">
            <h1>Forgot Password</h1>

            <p class="subtitle">
                Enter your email to reset your password.
            </p>

            <form id="forgotPasswordForm">

                <div class="inputGroup">
                    <input
                        type="email"
                        class="formInput"
                        placeholder="Enter your email"
                        id="resetEmail"
                        autocomplete="email"
                    >
                    <div id="resetEmailMessage" class="fieldMessage"></div>
                </div>

                <div id="forgotPasswordMessage"></div>

                <button type="submit" class="formButton" id="forgotPasswordBtn">
                    Send reset link
                </button>

            </form>

        </section>

        <div class="questionLogin">
            <p>
                Remembered your password?
                <a href="login.html" class="loginLink">Login</a>
            </p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/forgot-password.js"></script>

</div>
</body>
</html>
